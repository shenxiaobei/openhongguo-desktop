# 保留上游 CLI 的手动构建入口，避免桌面版发布时自动附加 CLI 成品。
name: CLI release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, such as v0.1.1
        required: true

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="openhongguo-cli_${TAG}_${os}_${arch}"
            exe=ohg
            if [ "$os" = windows ]; then exe=ohg.exe; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "build/$name/$exe" ./cmd/ohg
            cp LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum openhongguo-cli_* > "openhongguo-cli_${TAG}_checksums.txt")
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
